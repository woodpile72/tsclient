name: Build Debian Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper intltool pkg-config libgtk-4-dev libjson-glib-dev libsecret-1-dev xvfb
      - name: Regenerate local build configuration
        run: |
          autoreconf -fi
          ./configure --prefix=/usr
      - name: Build Debian package
        run: GTK_A11Y=none GTK_IM_MODULE=simple GSK_RENDERER=cairo xvfb-run -a dpkg-buildpackage -b -us -uc
      - name: Check application and profiles
        run: GSK_RENDERER=cairo GTK_A11Y=none GTK_IM_MODULE=simple xvfb-run -a make check
      - name: Collect packages
        run: |
          mkdir -p artifacts
          cp ../tsclient_*.deb ../tsclient-dbgsym_*.ddeb artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: artifacts/
          if-no-files-found: error
