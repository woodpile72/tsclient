name: Build Debian Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper intltool pkg-config libgtk-4-dev xvfb
      - name: Build Debian package
        run: dpkg-buildpackage -b -us -uc
      - name: Check GTK radio groups
        run: |
          cc -Isrc $(pkg-config --cflags gtk4) tests/test-radio-groups.c $(pkg-config --libs gtk4) -o /tmp/test-radio-groups
          GSK_RENDERER=cairo xvfb-run -a /tmp/test-radio-groups
      - uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: |
            ../tsclient_*.deb
            ../tsclient-dbgsym_*.ddeb
